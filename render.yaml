# ==============================================================================
# Render Blueprint Specification for TermiCode AI
# ==============================================================================

services:
  - type: web
    name: termicode-ai
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && pip install -e ."
    startCommand: "termicode web --host 0.0.0.0"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: TERMICODE_HOSTED_MODE
        value: "true"
      - key: TERMICODE_ENV
        value: "production"
